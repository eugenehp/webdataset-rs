[package]
name = "webdataset-shard"
description = "Streaming tar readers and writers for the webdataset format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
webdataset-core = { workspace = true, features = ["std", "json"] }
webdataset-io.workspace = true
bytes = { workspace = true, features = ["std"] }
flate2.workspace = true
log.workspace = true
tar.workspace = true

async-compression = { version = "0.4", optional = true, default-features = false, features = ["futures-io"] }
futures-core = { version = "0.3", optional = true, default-features = false, features = ["std"] }
futures-io = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std", "io"] }
bzip2 = { version = "0.6", optional = true }
liblzma = { version = "0.4", optional = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
tempfile.workspace = true
futures-executor = "0.3"
futures-util = "0.3"

[features]
default = ["threads", "subprocess"]
## Read each shard on a background thread, overlapping archive parsing with the
## consumer. Turn it off for targets without threads, such as WebAssembly.
threads = ["webdataset-core/threads"]
## Open shard URLs with a transfer tool; see `webdataset-io`.
subprocess = ["webdataset-io/subprocess"]
## Read shards from any `futures_io::AsyncRead`, yielding a `Stream` of samples.
async = ["dep:async-compression", "dep:futures-core", "dep:futures-io", "dep:futures-util", "async-compression/gzip"]
## Read and write `.tar.bz2` shards.
bzip2 = ["dep:bzip2", "async-compression?/bzip2"]
## Read and write `.tar.xz` shards.
xz = ["dep:liblzma", "async-compression?/xz"]
## Read and write `.tar.zst` shards.
zstd = ["dep:zstd", "async-compression?/zstd"]

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["threads", "subprocess", "async", "zstd", "bzip2", "xz"]
rustdoc-args = ["--cfg", "docsrs"]
