[package]
name = "webdataset-io"
description = "URL opening and shard caching for webdataset: file, pipe, http, gs, ais and hf schemes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
webdataset-core = { workspace = true, features = ["std", "json"] }
log.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["subprocess"]
## Open URLs by running a transfer tool: the `pipe:` scheme and the `curl`,
## `gsutil` and `ais` backed schemes. Turn it off on targets without
## subprocesses, such as WebAssembly, where only local and registered schemes
## remain.
subprocess = []

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
