[workspace]
resolver = "3"
members = [
    "crates/webdataset-core",
    "crates/webdataset-tenbin",
    "crates/webdataset-io",
    "crates/webdataset-shard",
    "crates/webdataset",
    "crates/webdataset-cli",
    "crates/webdataset-tools",
]
# The Python bindings are their own workspace: `--all-features` would turn on
# pyo3's `extension-module`, which deliberately leaves the interpreter's symbols
# unresolved, and that cannot be linked as an ordinary test binary.
exclude = ["crates/webdataset-python"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/eugenehp/webdataset-rs"
homepage = "https://github.com/eugenehp/webdataset-rs"
authors = ["Eugene Hauptmann"]
keywords = ["webdataset", "tar", "dataset", "machine-learning", "dataloader"]
categories = ["science", "data-structures", "encoding"]

[workspace.dependencies]
webdataset-core = { version = "0.0.1", path = "crates/webdataset-core", default-features = false }
webdataset-tenbin = { version = "0.0.1", path = "crates/webdataset-tenbin", default-features = false }
webdataset-io = { version = "0.0.1", path = "crates/webdataset-io", default-features = false }
webdataset-shard = { version = "0.0.1", path = "crates/webdataset-shard", default-features = false }
webdataset = { version = "0.0.1", path = "crates/webdataset" }

byteorder = "1.5"
bytes = { version = "1.12", default-features = false }
ciborium = "0.2"
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
flate2 = "1.1"
glob = "0.3"
image = "0.25"
indexmap = { version = "2.14", default-features = false }
log = "0.4"
rand = "0.10"
regex = "1.13"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false }
serde_yaml = "0.9"
tar = "0.4"
tempfile = "3.27"
thiserror = { version = "2.0", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
# Set by docs.rs so feature badges are rendered; see `package.metadata.docs.rs`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[profile.release]
lto = "thin"
codegen-units = 1
